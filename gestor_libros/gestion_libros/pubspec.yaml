name: gestion_libros
description: "A new Flutter project for LibriDex."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  
  # --- CONECTIVIDAD Y API ---
  # Para buscar libros en Google Books
  http: ^1.6.0
  
  # --- FIREBASE ---
  # Core, Autenticación y Base de Datos (Firestore)
  firebase_core: ^4.9.0
  firebase_auth: ^6.5.1
  cloud_firestore: ^6.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "images/logo.png"

flutter:
  uses-material-design: true

  # Registro de Assets (Imágenes del proyecto)
  assets:
    - images/logo.png